[project]
name = "carobd-ii-marketplace"
version = "0.1.0"
description = "Read OBD-2 fault data, diagnose with an AI agent, connect owners to a parts/mechanic marketplace."
readme = "README.md"
requires-python = ">=3.11"

# Phase 1 core: OBD reading + web backend. `uv sync` installs only these by default.
dependencies = [
    "obd>=0.7.2",              # python-obd: connect + query PIDs
    "pyserial>=3.5",           # serial transport (ELM327 over Bluetooth SPP)
    "fastapi>=0.110",          # web/API framework
    "uvicorn[standard]>=0.29", # ASGI server (WebSockets included)
    "websockets>=12.0",        # live readings push to the browser
]

[project.optional-dependencies]
# Storage layer:  uv sync --extra db
db = [
    "psycopg[binary]>=3.1",    # PostgreSQL (JSONB + TimescaleDB)
    "SQLAlchemy>=2.0",         # ORM / query layer
]

# Agentic diagnosis layer:  uv sync --extra agent   (sentence-transformers pulls torch — heavy)
agent = [
    "anthropic>=0.40",            # Claude API — agent orchestration + tool use
    "praw>=7.7",                  # Reddit API (post + read replies)
    "pypdf>=4.0",                 # parse owner's-manual PDFs into chunks
    "sentence-transformers>=2.6", # text embeddings
    "qdrant-client>=1.9",         # vector store SDK
    "pymongo>=4.7",               # raw scraped data + post/reply tracking
    "redis>=5.0",                 # agent session state
    "celery>=5.4",                # background jobs (Reddit reply polling)
]

# Testing:  uv sync --extra dev
dev = [
    "pytest>=8.0",
    "pytest-bdd>=7.0",         # Gherkin .feature microservice contract tests
]

[tool.uv]
# Install everything for local dev:  uv sync --all-extras
